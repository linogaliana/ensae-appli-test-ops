apiVersion: apps/v1
kind: Deployment
metadata:
  name: dvf-deployment
  labels:
    app: dvf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dvf
  template:
    metadata:
      labels:
        app: dvf
    spec:
      containers:
      - name: dvf
        image: linogaliana/application:v0.0.3
        ports:
        - containerPort: 8000
        env:
        - name: JETON_API
          valueFrom:
            secretKeyRef:
              name: api-jeton
              key: JETON_API
        - name: MLFLOW_TRACKING_URI
          value: "https://user-lgaliana-mlflow.user.lab.sspcloud.fr"
        - name: MLFLOW_TRACKING_USERNAME
          valueFrom:
            secretKeyRef:
              name: mlflow-secrets
              key: MLFLOW_TRACKING_USERNAME
        - name: MLFLOW_TRACKING_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mlflow-secrets
              key: MLFLOW_TRACKING_PASSWORD
